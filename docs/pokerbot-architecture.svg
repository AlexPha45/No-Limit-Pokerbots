<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">No-Limit pokerbot architecture</title>
  <desc id="description">Tournament state, table memory, and policy data enter the agent. The decision router selects an auction or betting strategy, then a legal-action guard validates the final action returned to the tournament engine.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#17233b"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="auction" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="betting" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#c026d3"/>
    </linearGradient>
    <linearGradient id="guard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.34"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .heading { font: 700 30px Inter, Segoe UI, Arial, sans-serif; fill: #f8fafc; }
      .subheading { font: 400 15px Inter, Segoe UI, Arial, sans-serif; fill: #94a3b8; }
      .node-title { font: 700 17px Inter, Segoe UI, Arial, sans-serif; fill: #f8fafc; }
      .node-text { font: 400 13px Inter, Segoe UI, Arial, sans-serif; fill: #dbeafe; }
      .small-title { font: 700 14px Inter, Segoe UI, Arial, sans-serif; fill: #e2e8f0; }
      .small-text { font: 400 12px Inter, Segoe UI, Arial, sans-serif; fill: #94a3b8; }
      .line { fill: none; stroke: #94a3b8; stroke-width: 2.25; marker-end: url(#arrow); }
      .line-soft { fill: none; stroke: #64748b; stroke-width: 1.75; stroke-dasharray: 6 6; marker-end: url(#arrow); }
      .source { fill: #1e293b; stroke: #475569; stroke-width: 1.5; }
      .detail { fill: #0f172a; fill-opacity: .58; stroke: #ffffff; stroke-opacity: .16; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1200" height="760" rx="28" fill="url(#background)"/>
  <circle cx="1100" cy="80" r="170" fill="#2563eb" opacity=".08"/>
  <circle cx="1020" cy="690" r="210" fill="#c026d3" opacity=".06"/>

  <text x="60" y="58" class="heading">No-Limit Pokerbot Architecture</text>
  <text x="60" y="86" class="subheading">Lookup-driven tournament strategy with separate betting and flop-auction paths</text>

  <!-- Inputs -->
  <g filter="url(#shadow)">
    <rect x="60" y="150" width="225" height="112" rx="16" class="source"/>
    <text x="82" y="182" class="node-title">Tournament state</text>
    <text x="82" y="207" class="node-text">Cards · board · pot · blinds</text>
    <text x="82" y="228" class="node-text">Stacks · position · history</text>
    <text x="82" y="249" class="node-text">Legal actions · payout config</text>

    <rect x="60" y="320" width="225" height="94" rx="16" class="source"/>
    <text x="82" y="352" class="node-title">Table memory</text>
    <text x="82" y="377" class="node-text">Current-table bookkeeping</text>
    <text x="82" y="398" class="node-text">Stale data safely ignored</text>

    <rect x="60" y="472" width="225" height="112" rx="16" class="source"/>
    <text x="82" y="504" class="node-title">policy.json</text>
    <text x="82" y="529" class="node-text">169 starting-hand classes</text>
    <text x="82" y="550" class="node-text">Percentiles · auction shares</text>
    <text x="82" y="571" class="node-text">Precomputed chart anchors</text>
  </g>

  <!-- Agent and router -->
  <g filter="url(#shadow)">
    <rect x="355" y="195" width="210" height="96" rx="18" fill="url(#agent)"/>
    <text x="460" y="231" text-anchor="middle" class="node-title">Agent.act()</text>
    <text x="460" y="257" text-anchor="middle" class="node-text">SDK entry point</text>
    <text x="460" y="278" text-anchor="middle" class="node-text">Selected strategy mode</text>

    <path d="M 460 335 L 525 395 L 460 455 L 395 395 Z" fill="#334155" stroke="#818cf8" stroke-width="2"/>
    <text x="460" y="388" text-anchor="middle" class="node-title">decide()</text>
    <text x="460" y="411" text-anchor="middle" class="node-text">Phase router</text>
  </g>

  <!-- Auction branch -->
  <g filter="url(#shadow)">
    <rect x="650" y="132" width="300" height="220" rx="20" fill="url(#auction)"/>
    <text x="675" y="168" class="node-title">Flop-auction strategy</text>
    <text x="675" y="192" class="node-text">Choose bids across five candidate cards</text>
    <rect x="675" y="215" width="250" height="42" rx="10" class="detail"/>
    <text x="800" y="241" text-anchor="middle" class="small-title">Combination hand scoring</text>
    <rect x="675" y="266" width="250" height="42" rx="10" class="detail"/>
    <text x="800" y="292" text-anchor="middle" class="small-title">Stack-aware chip budget</text>
    <rect x="675" y="317" width="250" height="42" rx="10" class="detail"/>
    <text x="800" y="343" text-anchor="middle" class="small-title">Five-card bid vector</text>
  </g>

  <!-- Betting branch -->
  <g filter="url(#shadow)">
    <rect x="650" y="410" width="300" height="238" rx="20" fill="url(#betting)"/>
    <text x="675" y="446" class="node-title">Betting strategy</text>
    <text x="675" y="470" class="node-text">Preflop lookup or postflop evaluation</text>
    <rect x="675" y="493" width="250" height="42" rx="10" class="detail"/>
    <text x="800" y="519" text-anchor="middle" class="small-title">Heuristic / exact / Monte Carlo equity</text>
    <rect x="675" y="544" width="250" height="42" rx="10" class="detail"/>
    <text x="800" y="570" text-anchor="middle" class="small-title">Position · pot · opponent features</text>
    <rect x="675" y="595" width="250" height="42" rx="10" class="detail"/>
    <text x="800" y="621" text-anchor="middle" class="small-title">ICM or chip-EV utility</text>
  </g>

  <!-- Output -->
  <g filter="url(#shadow)">
    <rect x="1005" y="276" width="155" height="142" rx="18" fill="url(#guard)"/>
    <text x="1082" y="312" text-anchor="middle" class="node-title">Action guard</text>
    <text x="1082" y="339" text-anchor="middle" class="node-text">Validate kind</text>
    <text x="1082" y="360" text-anchor="middle" class="node-text">Clamp raise</text>
    <text x="1082" y="381" text-anchor="middle" class="node-text">Safe fallback</text>

    <rect x="1005" y="487" width="155" height="112" rx="18" fill="#f8fafc"/>
    <text x="1082" y="523" text-anchor="middle" style="font:700 17px Inter,Segoe UI,Arial,sans-serif;fill:#0f172a">SDK Action</text>
    <text x="1082" y="550" text-anchor="middle" style="font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#334155">fold · check · call</text>
    <text x="1082" y="572" text-anchor="middle" style="font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#334155">raise · bid</text>
  </g>

  <!-- Connectors -->
  <path d="M 285 205 C 320 205 323 243 355 243" class="line"/>
  <path d="M 285 367 C 330 367 330 270 355 270" class="line-soft"/>
  <path d="M 460 291 L 460 332" class="line"/>
  <path d="M 525 395 C 580 395 580 242 650 242" class="line"/>
  <path d="M 525 395 C 580 395 580 529 650 529" class="line"/>
  <path d="M 285 528 C 465 528 470 310 675 310" class="line-soft"/>
  <path d="M 285 550 C 480 550 500 514 675 514" class="line-soft"/>
  <path d="M 950 242 C 985 242 985 320 1005 320" class="line"/>
  <path d="M 950 529 C 985 529 985 385 1005 385" class="line"/>
  <path d="M 1082 418 L 1082 484" class="line"/>

  <text x="650" y="715" text-anchor="middle" class="small-text">Final iteration shown · earlier modes share the same entry point, phase routing, policy lookup, and safety guardrails</text>
</svg>
